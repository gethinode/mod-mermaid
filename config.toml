[module]
  [module.hugoVersion]
    extended = true
    min = "0.146.0"
    max = ""
  [[module.mounts]]
    source = "dist/mermaid.esm.min.mjs"
    target = "static/js/mermaid/mermaid.esm.min.mjs"
  [[module.mounts]]
    source = "dist/chunks/mermaid.esm.min"
    target = "static/js/mermaid/chunks/mermaid.esm.min"
  # The ELK layout engine is an asset, not a static file: Hugo copies static mounts into
  # the publish directory unconditionally (10 MB on every site), but writes an asset only
  # when a template publishes it. mermaid-init.mjs does so when modules.mermaid.elk is
  # set, at the /js/mermaid-layout-elk/ URLs it imports from. It is mounted outside
  # assets/js/ on purpose: site templates bundle everything matching "js/**.mjs", and this
  # minified code must not be swept into (or parsed as part of) that bundle.
  [[module.mounts]]
    source = "dist/layout-elk"
    target = "assets/mermaid-layout-elk"
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'data'
    target = 'data'
  [[module.mounts]]
    source = 'i18n'
    target = 'i18n'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  [[module.imports]]
    path = "github.com/gethinode/mod-fontawesome/v6"
  [[module.imports]]
    path = "github.com/gethinode/mod-utils/v6"

# Icon defaults for mod-mermaid components
[params.icons]
  diagramDownload   = "fas download"
  diagramExpand     = "fas arrows-to-dot"
  diagramFullscreen = "fas expand"
  diagramZoomOut    = "fas magnifying-glass-minus"
  diagramZoomIn     = "fas magnifying-glass-plus"
